steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile
      - --tag=${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  machineType: E2_HIGHCPU_8
substitutions:
  _IMAGE: northamerica-northeast2-docker.pkg.dev/${PROJECT_ID}/vetchain/vet-gw-node-ts:production
