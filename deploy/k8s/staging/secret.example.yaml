apiVersion: v1
kind: Secret
metadata:
  name: gdc-unid-node-ts-staging-secret
type: Opaque
stringData:
  # Copy this file per operator/profile and keep the values aligned with the
  # generic env.staging.example contract. Real values stay in the deployment
  # platform's secret store and must not be committed.
  # Primary Firebase Admin/data project. This is a project ID, not a URL.
  FIREBASE_PROJECT_ID: replace-me
  # Extra Firebase token audiences only. Does not select Firestore or GCS.
  FIREBASE_ADDITIONAL_AUTH_PROJECT_IDS: replace-with-portal-auth-project
  GCS_BUCKET_NAME: replace-me
  KMS_KEY_ID: projects/replace-me/locations/europe-southwest1/keyRings/gw/cryptoKeys/staging
  # Required only when KMS_PROVIDER=aws; ignored by GCP.
  KMS_REGION: ""
  # Ciphertext only; generate with `npm run kms:provision-runtime-kek`.
  KMS_RUNTIME_KEK_CIPHERTEXT: replace-with-kms-ciphertext
  # Must contain the same value as the portal's
  # PROFESSIONAL_POSTAL_CODE_PEPPER; it verifies, but never stores, the clear
  # code supplied at Order.
  HOST_POSTAL_ACTIVATION_PEPPER: replace-with-shared-postal-pepper
  HOST_ORGANIZATION_AUTHORIZATION_ISSUERS: did:web:replace-with-unid-organization
  # JSON array of exact active/revoked reviewer DID, RESPRSN role and RFC 9278
  # ML-DSA-65 thumbprints. Remove after the key is published through DID.
  HOST_ORGANIZATION_AUTHORIZATION_SIGNERS: '[{"issuer":"did:web:replace-with-operator-organization","actorDid":"did:web:replace-with-operator-organization:employee:zEmailHash:RESPRSN","role":"RESPRSN","status":"active","jwkThumbprints":["urn:ietf:params:oauth:jwk-thumbprint:sha-256:replace-with-exact-public-key-thumbprint"]}]'
  TWILIO_ACCOUNT_SID: replace-me
  TWILIO_AUTH_TOKEN: replace-me
  TWILIO_VOICE_FROM_NUMBER: replace-me
