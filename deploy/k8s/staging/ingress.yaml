apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gdc-unid-node-ts
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.allow-http: "false"
    networking.gke.io/managed-certificates: gdc-unid-node-ts-staging-cert
spec:
  rules:
    - host: gw-unid-staging.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gdc-unid-node-ts
                port:
                  name: http
